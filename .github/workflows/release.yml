# Сборка и публикация образов в GitHub Container Registry (ghcr.io).
name: Release

on:
  release:
    types: [published]

# На случай повторной публикации/republish того же релиза — не гоняем
# параллельные пересекающиеся ranы.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    # Общий переиспользуемый workflow с ci.yml — один источник правды на
    # тестовые шаги.
    uses: ./.github/workflows/unit-tests.yml

  publish:
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: billing
            context: .
            file: src/Dockerfile
            target: runtime
          - name: scheduler
            context: ./scheduler
            file: ./scheduler/Dockerfile
            target: ""
          - name: luaworker
            context: ./luaworker
            file: ./luaworker/Dockerfile
            target: ""
          - name: mediaworker
            context: ./mediaworker
            file: ./mediaworker/Dockerfile
            target: runtime
          - name: adminui
            context: .
            file: ./adminui/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v7
        with:
          # setuptools_scm вычисляет версию из git-тегов — стандартный
          # shallow-чекаут Actions (depth=1, без тегов) их не увидит.
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute app version
        if: matrix.name != 'luaworker' && matrix.name != 'scheduler'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          CLEAN_VER="${TAG#v}"
          if [ -n "$CLEAN_VER" ]; then
            echo "$CLEAN_VER" > VERSION
          else
            pip install --quiet setuptools_scm
            python -c "import sys; sys.path.insert(0, 'src'); from utils.version import resolve_app_version; from pathlib import Path; open('VERSION', 'w').write(resolve_app_version(Path('.')))"
          fi
          if [ "${{ matrix.name }}" = "mediaworker" ]; then cp VERSION mediaworker/VERSION; fi
          echo "Resolved version: $(cat VERSION)"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
            type=raw,value=nightly,enable=${{ github.event.release.prerelease }}
            type=raw,value=${{ github.event.release.tag_name }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_GIT_COMMIT=${{ github.sha }}
            VITE_GIT_COMMIT_DATE=${{ github.event.release.published_at }}
            VITE_APP_VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-complete:
    # Единая точка "весь набор образов релиза опубликован успешно"
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - name: All images published
        run: |
          echo "release ${{ github.event.release.tag_name }}: all images (billing/scheduler/luaworker/mediaworker/adminui) published successfully"
